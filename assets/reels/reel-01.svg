<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <pattern id="grid-1080" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="grad-1080" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161a" />
      <stop offset="50%" stop-color="#111114" />
      <stop offset="100%" stop-color="#0b0b0e" />
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#grad-1080)" />
  <rect width="1080" height="1920" fill="url(#grid-1080)" />
  <rect x="24" y="24" width="1032" height="1872" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="6 6" rx="12" />

