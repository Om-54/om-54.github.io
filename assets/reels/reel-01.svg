  <g transform="translate(540.0, 960.0)">
    <!-- Outer Icon Circle -->
    <circle r="129.6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    
    <!-- Upload Icon -->
    <path d="M -18 8 L 0 -10 L 18 8 M 0 -10 L 0 20 M -32 24 L 32 24" fill="none" stroke="#ff5c4d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="scale(1.944) translate(0, -6)"/>

    <!-- Primary Label -->
    <rect x="-180" y="172.8" width="360" height="46" rx="23" fill="#ff5c4d" />
    <text x="0" y="200.8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">[UPLOAD ACTUAL WORK]</text>

    <!-- Title -->
    <text x="0" y="257.8" font-family="'Syne', system-ui, sans-serif" font-size="24" font-weight="700" fill="#f4f4f6" text-anchor="middle" letter-spacing="0.5">SHORT-FORM REEL 01</text>

    <!-- Aspect & Instructions -->
    <text x="0" y="292.8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#a1a1aa" text-anchor="middle">9:16 Instagram Reel</text>
    <text x="0" y="322.8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="400" fill="#71717a" text-anchor="middle">Replace with assets/reels/reel-01.mp4</text>
