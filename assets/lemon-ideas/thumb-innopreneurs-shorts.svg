<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bgShorts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c09"/>
      <stop offset="35%" stop-color="#0f1f14"/>
      <stop offset="70%" stop-color="#193322"/>
      <stop offset="100%" stop-color="#070b08"/>
    </linearGradient>
    <linearGradient id="goldButton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glowShorts" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bgShorts)"/>

  <!-- Geometric & Atmospheric Elements -->
  <circle cx="540" cy="500" r="450" fill="#facc15" opacity="0.07" filter="blur(100px)"/>
  <circle cx="300" cy="1400" r="400" fill="#22c55e" opacity="0.08" filter="blur(120px)"/>

  <!-- Subtle Perspective Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="400" x2="1080" y2="400"/>
    <line x1="0" y1="800" x2="1080" y2="800"/>
    <line x1="0" y1="1200" x2="1080" y2="1200"/>
    <line x1="0" y1="1600" x2="1080" y2="1600"/>
    <line x1="270" y1="0" x2="270" y2="1920"/>
    <line x1="540" y1="0" x2="540" y2="1920"/>
    <line x1="810" y1="0" x2="810" y2="1920"/>
  </g>

  <!-- Top Event Pill -->
  <rect x="80" y="140" width="460" height="60" rx="30" fill="#1b2a1f" stroke="#36533f" stroke-width="2"/>
  <circle cx="120" cy="170" r="10" fill="#facc15"/>
  <text x="145" y="177" fill="#fef08a" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" letter-spacing="2">LEMON IDEAS • EVENT REEL</text>

  <!-- Main Headline Block -->
  <text x="80" y="320" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800" letter-spacing="2">
    OFFICIAL GLIMPSES
  </text>
  <text x="80" y="440" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="92" font-weight="900" letter-spacing="-3">
    INNOPRENEURS
  </text>
  <text x="80" y="550" fill="#facc15" font-family="'Plus Jakarta Sans', sans-serif" font-size="88" font-weight="900" letter-spacing="-2">
    SEASON 11
  </text>
  <text x="80" y="630" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="600">
    Finale &amp; Grand Finale Highlights
  </text>

  <!-- Middle Visual Mockup (Shorts Video Stage Frame) -->
  <g transform="translate(80, 720)">
    <rect width="920" height="740" rx="24" fill="#142118" stroke="#2a4533" stroke-width="2.5"/>
    
    <!-- Stage Audience & Spotlight Illustration -->
    <rect x="30" y="30" width="860" height="520" rx="16" fill="#0d1711"/>
    <polygon points="430,30 200,550 660,550" fill="#facc15" opacity="0.15"/>
    
    <!-- Big Stage Screen Silhouette -->
    <rect x="180" y="120" width="500" height="260" rx="12" fill="#1b2e21" stroke="#36533f" stroke-width="2"/>
    <text x="430" y="230" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" text-anchor="middle">STARTUP PITCHES</text>
    <text x="430" y="280" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="600" text-anchor="middle">&amp; FOUNDER SHOWCASE</text>
    
    <!-- Crowd Silhouette -->
    <g fill="#16271c">
      <circle cx="200" cy="510" r="50"/>
      <circle cx="340" cy="500" r="55"/>
      <circle cx="480" cy="495" r="58"/>
      <circle cx="620" cy="505" r="54"/>
      <circle cx="760" cy="515" r="48"/>
    </g>

    <!-- Meta Details at bottom of frame -->
    <g transform="translate(40, 585)">
      <text x="0" y="35" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700">FORMAT: 9:16 VERTICAL SHORT-FORM REEL</text>
      <text x="0" y="80" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="500">Fast cuts, dynamic audience reactions &amp; energetic audio</text>
    </g>
  </g>

  <!-- Big Play Button at Bottom -->
  <g transform="translate(540, 1640)">
    <circle cx="0" cy="0" r="90" fill="url(#goldButton)" filter="url(#glowShorts)"/>
    <polygon points="-16,-34 32,0 -16,34" fill="#000000"/>
    <text x="0" y="130" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" text-anchor="middle">PLAY GLIMPSES REEL</text>
    <text x="0" y="175" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="600" text-anchor="middle">DRIVE ID: 1Dk2OtPLbNjV79hSM9rqNIqitjFKakZbb</text>
  </g>
</svg>
