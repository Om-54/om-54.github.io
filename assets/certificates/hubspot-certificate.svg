    <path d="M -18 8 L 0 -10 L 18 8 M 0 -10 L 0 20 M -32 24 L 32 24" fill="none" stroke="#ff5c4d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="scale(2.034) translate(0, -6)"/>

    <!-- Primary Label -->
    <rect x="-180" y="180.8" width="360" height="46" rx="23" fill="#ff5c4d" />
    <text x="0" y="208.8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">[UPLOAD HUBSPOT CERTIFICATE]</text>

