    </pattern>
    <linearGradient id="grad-1600" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161a" />
      <stop offset="50%" stop-color="#111114" />
      <stop offset="100%" stop-color="#0b0b0e" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1130" fill="url(#grad-1600)" />
  <rect width="1600" height="1130" fill="url(#grid-1600)" />
  <rect x="24" y="24" width="1552" height="1082" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="6 6" rx="12" />

